name: Pipeline nocturne

# Remplit le feed sans que le PC soit allume.
#
# CLAUDE_CODE_OAUTH_TOKEN authentifie Claude Code avec l'abonnement : les
# runs consomment le quota d'abonnement, pas de la facturation API. Le token
# se genere en local avec `claude setup-token`.

on:
  schedule:
    # 03:00 UTC, soit 04h ou 05h a Paris selon la saison. GitHub decale les
    # crons charges de quelques minutes, ce qui est sans importance ici.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'items a traiter"
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Installer Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Installer les dependances
        working-directory: pipeline
        run: npm ci

      - name: Lancer le pipeline
        working-directory: pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node run.mjs --limit ${{ github.event.inputs.limit || '60' }}

      - name: Conserver les logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pipeline
          path: pipeline/logs/
          retention-days: 14
          if-no-files-found: ignore
